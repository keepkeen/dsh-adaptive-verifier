# Add the plugin as a bundle, then override this row's config in your profile.
- id: adaptive-verifier
  name: dsh-adaptive-verifier
  config:
    adapter:
      enabled: true
      provider: deepseek-verified
      initialCandidates: 2
      maxCandidates: 4
      generationTemperature: 0.6
    verification:
      initialRepeats: 1
      maxRepeats: 4
      reverseOnAmbiguity: true
    budget:
      maxCalls: 12
      maxUncachedInputTokens: 120000
      maxOutputTokens: 40000
      maxWallClockMs: 120000
      maxEstimatedInputTokensPerCall: 90000
    hooks:
      observeSessions: true
      evidenceGate: advisory
      steerBeforeTurnEnd: false

# In the agent row supplied by your profile, choose this route:
# provider: deepseek-verified
# model: deepseek-v4-flash
#
# DeepSeek Harness patch rows replace a row's complete config rather than
# deep-merging it, so preserve the other keys required by your agent row.
